name: Deploy TradeThesis Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate individual challenge pages
        run: python3 scripts/generate_challenge_pages.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true
      # GitHub's artifact metadata can lag behind the upload completion response.
      - name: Wait for Pages artifact indexing
        run: sleep 10
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
