  <title>Challenge | TradeThesis</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--paper:#f4f0e8;--paper2:#ebe5d9;--ink:#242923;--muted:#73766d;--line:#d9d2c5;--terra:#b95f43;--terra2:#e9c5b5;--sage:#748574;--sage2:#d9e0d4;--gold:#c49a53;--white:#fffdf8;--shadow:0 12px 30px rgba(44,40,32,.07);font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper)}a{color:inherit}
    .app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 18px calc(104px + env(safe-area-inset-bottom))}
    .topbar{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}
    .brand{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .brand img{width:38px;height:38px;object-fit:contain}
    .back-link{font:10px "DM Mono",monospace;letter-spacing:.08em;text-decoration:none;color:var(--terra);font-weight:700;white-space:nowrap}
    .eyebrow{font:10px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.15em;color:var(--terra)}
    .page-head{padding:27px 0 18px}.page-head h1{font:600 34px/1.08 "Playfair Display",serif;letter-spacing:-.6px;margin:9px 0 9px;overflow-wrap:anywhere}
    .page-head p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;max-width:470px}
    .meta-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font:10px "DM Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
    .state-pill{display:inline-flex;align-items:center;padding:5px 8px;border:1px solid var(--line);font:800 9px "DM Mono",monospace;letter-spacing:.08em}
    .state-pill.active{background:#e3eadf;color:#526b50;border-color:#bfcfba}
    .state-pill.scheduled{background:#f2e9d4;color:#85682e;border-color:#dfc999}
    .state-pill.completed{background:#e9e5dc;color:#6f7067;border-color:#d5cfc2}
    .panel{background:var(--white);border:1px solid var(--line);padding:17px;margin:0 0 13px;box-shadow:var(--shadow)}
    .panel h2{font:600 21px "Playfair Display",serif;margin:0 0 13px}
    .balance-label{font:9px "DM Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
    .balance-value{display:block;font:700 clamp(27px,8vw,36px) "DM Mono",monospace;letter-spacing:-1px;margin-top:5px;overflow-wrap:anywhere}
    .pnl-value{font:700 15px "DM Mono",monospace;color:#587650}.pnl-value.negative{color:#a64b42}

    .progress-track i{display:block;height:100%;background:linear-gradient(90deg,#9a7441,#d4b774);transition:width .5s}
    .progress-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font:9px "DM Mono",monospace;color:var(--muted)}

    .metric{min-width:0;background:var(--paper);border:1px solid var(--line);padding:10px 9px}
    .metric span{display:block;font:9px "DM Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .metric strong{display:block;margin-top:6px;font:700 14px "DM Mono",monospace;overflow-wrap:anywhere}
    .outcome-line{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font:10px "DM Mono",monospace;color:var(--muted);line-height:1.6}
    .trade-row{padding:13px 0;border-top:1px solid var(--line)}
    .trade-row:first-of-type{border-top:0;padding-top:0}
    .trade-top,.trade-bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .trade-symbol{font-size:13px;font-weight:700;overflow-wrap:anywhere}
    .trade-date{font:9px "DM Mono",monospace;color:var(--muted);white-space:nowrap}
    .trade-side{display:inline-block;margin-top:5px;font:9px "DM Mono",monospace;color:var(--terra);letter-spacing:.08em}
    .trade-meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;font:9px "DM Mono",monospace;color:var(--muted)}
    .trade-meta span{background:var(--paper);border:1px solid var(--line);padding:5px 7px}
    .trade-status{font:9px "DM Mono",monospace;color:var(--muted);text-transform:uppercase}
    .trade-pnl{font:700 10px "DM Mono",monospace;color:#587650;text-align:right}
    .trade-pnl.negative{color:#a64b42}
    .empty-state,.error-state{padding:24px 16px;text-align:center;background:var(--white);border:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.6}
    .empty-state strong,.error-state strong{display:block;font:600 19px "Playfair Display",serif;color:var(--ink);margin-bottom:6px}
    .note{font-size:10px;line-height:1.55;color:var(--muted);margin:12px 0}
    .footer{padding:20px 0;text-align:center;font:9px "DM Mono",monospace;letter-spacing:.1em;color:var(--muted)}
    .bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:10px 13px calc(10px + env(safe-area-inset-bottom));background:rgba(244,240,232,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
    .nav-item{border:0;background:none;color:#898a80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:3px 0;text-decoration:none;font:600 9px "DM Sans",sans-serif}
    .nav-item .nav-icon{font:18px "Playfair Display",serif;line-height:1}
    .nav-item.active{color:var(--terra)}
    .nav-item:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
    @media(max-width:380px){.app{padding-left:14px;padding-right:14px}.panel{padding:14px}.metric-grid{gap:5px}.metric{padding:9px 7px}.metric strong{font-size:12px}.trade-date{font-size:8px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="back-link" id="backLink" href="../../?view=challenges">← ALL CHALLENGES</a>
      <div class="brand"><img src="../../assets/tradethesis-mark.svg" alt="">TRADETHESIS</div>
    </header>
    <main>
      <div id="loadingState" class="empty-state" style="margin-top:22px">Loading this challenge…</div>
      <div id="challengeDetail" hidden></div>
      <div id="errorState" class="error-state" hidden></div>
    </main>
    <footer class="footer">TRADETHESIS · CONVICTION BEFORE EXECUTION</footer>
  </div>
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="../../?view=home"><span class="nav-icon" aria-hidden="true">⌂</span><span>Home</span></a>
    <a class="nav-item active" href="../../?view=challenges" aria-current="page"><span class="nav-icon" aria-hidden="true">⚑</span><span>Challenges</span></a>
    <a class="nav-item" href="../../?view=tools"><span class="nav-icon" aria-hidden="true">⌘</span><span>Tools</span></a>
    <a class="nav-item" href="../../?view=learn"><span class="nav-icon" aria-hidden="true">∴</span><span>Learn</span></a>
    <a class="nav-item" href="../../?view=about"><span class="nav-icon" aria-hidden="true">◎</span><span>About</span></a>
  </nav>
  <script>
    const CHALLENGE_ID = __CHALLENGE_ID_JSON__;
    const tg = window.Telegram && window.Telegram.WebApp;
    const appRoot = new URL('../../', window.location.href);
    const params = new URLSearchParams(window.location.search);
    const returnView = params.get('from') === 'home' ? 'home' : 'challenges';
    const returnUrl = new URL(returnView === 'home' ? '?view=home' : '?view=challenges', appRoot);
    const returnLabel = returnView === 'home' ? '← HOME' : '← ALL CHALLENGES';
    const dataUrl = new URL('data/challenges.json', appRoot);
    const backLink = document.getElementById('backLink');
    backLink.href = returnUrl.href;
    backLink.textContent = returnLabel;

    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#f4f0e8'); tg.setBackgroundColor('#f4f0e8'); } catch (e) {}
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(() => { window.location.href = returnUrl.href; });
      }
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, character => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[character]));
    }
    function numberFormat(value) {
      const number = Number(value || 0);
      return new Intl.NumberFormat('en-IN', { maximumFractionDigits: 4 }).format(number);
    }
    function money(value, currency) {
      const amount = Number(value || 0);
      try {
        return new Intl.NumberFormat('en-IN', {
          style:'currency', currency:currency || 'USD', maximumFractionDigits:2
        }).format(amount);
      } catch (error) {
        return (currency || 'USD') + ' ' + numberFormat(amount);
      }
    }
    function price(value) {
      if (value === null || value === undefined || value === '') return '—';
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString('en-IN', { maximumFractionDigits:5 }) : '—';
    }
    function dateLabel(value, options) {
      const timestamp = Date.parse(value || '');
      if (!Number.isFinite(timestamp)) return '—';
      return new Date(timestamp).toLocaleString('en-IN', Object.assign({
        timeZone:'Asia/Kolkata'
      }, options || { day:'2-digit', month:'short', year:'numeric' }));
    }
    function campaignStatus(campaign) {
      const raw = String(campaign.status || (campaign.scheduled ? 'SCHEDULED' : campaign.archived ? 'COMPLETED' : campaign.active ? 'ACTIVE' : 'INACTIVE')).toUpperCase();
      if (raw === 'SCHEDULED') return { label:'SCHEDULED', className:'scheduled' };
      if (raw === 'COMPLETED' || campaign.archived) return { label:'COMPLETED', className:'completed' };
      if (raw === 'ACTIVE' || campaign.active) return { label:'ACTIVE', className:'active' };
      return { label:raw, className:'completed' };
    }
    function renderTradeHistory(trades, currency) {
      if (!trades.length) {
        return '<div class="empty-state"><strong>No trades recorded yet</strong>Trade entries for this challenge will appear here as they are published.</div>';
      }
      const sorted = trades.slice().sort((a,b) => Date.parse(b.opened_at || '') - Date.parse(a.opened_at || ''));
      return sorted.map(trade => {
        const status = String(trade.status || 'OPEN').toUpperCase();
        const pnl = Number(trade.realised_pnl || 0);
        const pnlClass = pnl > 0 ? '' : pnl < 0 ? 'negative' : '';
        const pnlText = (pnl > 0 ? '+' : pnl < 0 ? '−' : '') + money(Math.abs(pnl), currency);
        const leverage = Number(trade.leverage_multiplier) > 0 ? numberFormat(trade.leverage_multiplier) + ':1' : '—';
        return '<article class="trade-row">' +
          '<div class="trade-top"><div><div class="trade-symbol">' + escapeHtml(trade.symbol || 'Instrument unavailable') + '</div>' +
          '<span class="trade-side">' + escapeHtml(trade.side || '—') + '</span></div>' +
          '<time class="trade-date">' + escapeHtml(dateLabel(trade.opened_at, { day:'2-digit', month:'short', year:'numeric' })) + '</time></div>' +
          '<div class="trade-meta"><span>ENTRY ' + escapeHtml(price(trade.entry_price)) + '</span><span>EXIT ' + escapeHtml(price(trade.exit_price)) + '</span><span>LEVERAGE ' + escapeHtml(leverage) + '</span></div>' +
          '<div class="trade-bottom"><span class="trade-status">' + escapeHtml(status) + '</span><strong class="trade-pnl ' + pnlClass + '">' + escapeHtml(pnlText) + (status === 'CLOSED' ? ' REALISED' : '') + '</strong></div>' +
          '</article>';
      }).join('');
    }
    function renderChallenge(campaign, data) {
      const currency = campaign.currency || 'USD';
      const status = campaignStatus(campaign);
      const progressValue = Number(campaign.progress_pct || 0);
      const progressWidth = Math.min(100, Math.max(0, progressValue));
      const realised = Number(campaign.realised_pnl || 0);
      const pnlClass = realised < 0 ? 'negative' : '';
      const title = String(campaign.name || 'Trading Challenge');
      const tradeHistory = Array.isArray(campaign.trade_history) ? campaign.trade_history : [];
      const launchNote = campaign.starts_at
        ? '<div class="note">SCHEDULED LAUNCH · ' + escapeHtml(dateLabel(campaign.starts_at, { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true })) + ' IST</div>'
        : '';
      const generated = data.generated_at
        ? '<p class="note">Figures last published ' + escapeHtml(dateLabel(data.generated_at, { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })) + ' IST</p>'
        : '';
      document.title = title + ' | TradeThesis';
      document.getElementById('challengeDetail').innerHTML =
        '<header class="page-head">' +
          '<div class="eyebrow">Individual challenge · ' + escapeHtml(campaign.asset_class || campaign.instrument || 'Trading campaign') + '</div>' +
          '<h1>' + escapeHtml(title) + '</h1>' +
          '<p>' + escapeHtml(campaign.description || campaign.brief || 'Campaign progress and trade history.') + '</p>' +
          '<div class="meta-line"><span class="state-pill ' + status.className + '">' + status.label + '</span><span>' + escapeHtml(campaign.instrument || campaign.asset_class || 'MARKET') + '</span></div>' +
          launchNote +
        '</header>' +
        '<section class="panel">' +
          '<div class="balance-label">Current balance</div>' +
          '<strong class="balance-value">' + escapeHtml(money(campaign.current_balance, currency)) + '</strong>' +
          '<div class="pnl-value ' + pnlClass + '">' + (realised > 0 ? '+' : realised < 0 ? '−' : '') + escapeHtml(money(Math.abs(realised), currency)) + ' realised P&amp;L</div>' +
          '<div class="progress-head"><span>Target progress</span><strong>' + escapeHtml(numberFormat(progressValue)) + '%</strong></div>' +
          '<div class="progress-track"><i style="width:' + progressWidth + '%"></i></div>' +
          '<div class="progress-foot"><span>START · ' + escapeHtml(money(campaign.starting_balance, currency)) + '</span><span>TARGET · ' + escapeHtml(money(campaign.target_balance, currency)) + '</span></div>' +
          '<div class="metric-grid">' +
            '<div class="metric"><span>Trades</span><strong>' + escapeHtml(numberFormat(campaign.total_trades || tradeHistory.length)) + '</strong></div>' +
            '<div class="metric"><span>Wins</span><strong>' + escapeHtml(numberFormat(campaign.wins || 0)) + '</strong></div>' +
            '<div class="metric"><span>Losses</span><strong>' + escapeHtml(numberFormat(campaign.losses || 0)) + '</strong></div>' +
            '<div class="metric"><span>Open</span><strong>' + escapeHtml(numberFormat(campaign.open_trades || 0)) + '</strong></div>' +
            '<div class="metric"><span>Breakeven</span><strong>' + escapeHtml(numberFormat(campaign.breakeven || 0)) + '</strong></div>' +
            '<div class="metric"><span>Remaining</span><strong>' + escapeHtml(money(campaign.remaining_to_target, currency)) + '</strong></div>' +
          '</div>' +
          '<div class="outcome-line">STATUS · ' + escapeHtml(status.label) + ' &nbsp;·&nbsp; ' + escapeHtml(numberFormat(tradeHistory.length)) + ' TRADE RECORDS</div>' +
        '</section>' +
        '<section class="panel"><h2>Trade history</h2>' + renderTradeHistory(tradeHistory, currency) + '</section>' +
        '<p class="note">' + escapeHtml(data.basis_note || 'Campaign balance and performance are based on the published challenge ledger.') + '</p>' +
        generated;
      document.getElementById('loadingState').hidden = true;
      document.getElementById('challengeDetail').hidden = false;
    }
    async function loadChallenge() {
      try {
        const response = await fetch(dataUrl.href, { cache:'no-store' });
        if (!response.ok) throw new Error('Challenge data could not be loaded.');
        const data = await response.json();
        const campaigns = Array.isArray(data.challenges) ? data.challenges : [];
        const campaign = campaigns.find(item => String(item.id) === String(CHALLENGE_ID));
        if (!campaign) {
          document.getElementById('loadingState').hidden = true;
          document.getElementById('errorState').hidden = false;
          document.getElementById('errorState').innerHTML = '<strong>Challenge not found</strong>This challenge may have been removed or its link may be incorrect. Return to the challenge catalogue to see the available campaigns.';
          return;
        }
        renderChallenge(campaign, data);
      } catch (error) {
        document.getElementById('loadingState').hidden = true;
        document.getElementById('errorState').hidden = false;
        document.getElementById('errorState').innerHTML = '<strong>Challenge unavailable</strong>' + escapeHtml(error.message || 'Challenge information could not be loaded.') + ' Try returning to the catalogue.';
      }
    }
    loadChallenge();
  </script>
</body>
</html>
